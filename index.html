<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Specialty Coffee · Barcelona</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root {
    /* Change this single variable to re-theme accents everywhere. */
    --accent: #ff7a59;

    --bg: #0a0c10;
    --panel: #0f1218;
    --panel-2: #161a22;
    --text: #e6e8ec;
    --muted: #8a93a3;
    --border: #1f2530;

    /* Category colors — used for markers, sidebar labels, popups, filters. */
    --c-coffee: #c68a4e;
    --c-brunch: #e8c15a;
    --c-sushi: #3fb6c9;
    --c-asian: #d6598f;
    --c-tapas: #a8455c;
    --c-vegan: #6cae5b;
    --c-bakery: #e39bc0;
    --c-pizza: #d97347;
    --c-burger: #8a5a3c;
    --c-bar: #8f7fd6;
    --c-restaurant: #ff7a59;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }

  #app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar { background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; }
  .side-header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
  .side-header h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: -0.01em; font-weight: 600; }
  .side-header .sub { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .count { display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--accent); font-size: 11px; font-weight: 600;
    margin-left: 6px; vertical-align: middle; }

  .filters { display: flex; gap: 6px; padding: 12px 18px 0; flex-wrap: wrap; }
  .filter-btn {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
    padding: 6px 12px; font-size: 11px; font-weight: 600; border-radius: 999px;
    cursor: pointer; font-family: inherit; letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--muted); }
  .filter-btn.active { background: var(--accent); color: #0a0c10; border-color: var(--accent); }
  .filter-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle; background: currentColor; }

  .list { flex: 1; overflow-y: auto; padding-top: 12px; }
  .row { padding: 12px 18px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s; border-left: 3px solid transparent; }
  .row:hover { background: var(--panel-2); }
  .row.active { background: var(--panel-2); border-left-color: var(--accent); }
  .row .cat { font-size: 10px; color: var(--marker-color, var(--accent)); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 0 0 4px; font-weight: 600; }
  .row .name { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .row .note { font-size: 12px; color: var(--muted); margin: 0 0 6px; line-height: 1.45; }
  .row a { color: var(--accent); font-size: 11px; text-decoration: none; font-weight: 600; }
  .row a:hover { text-decoration: underline; }

  /* ---------- Map ---------- */
  #map-wrap { position: relative; }
  #map { position: absolute; inset: 0; }

  .controls { position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; gap: 8px; }
  .btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 8px;
    cursor: pointer; font-family: inherit; letter-spacing: 0.04em;
    backdrop-filter: blur(6px);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #0a0c10; border-color: var(--accent); }

  /* ---------- Markers ----------
     CRITICAL: .marker (the element passed to new maplibregl.Marker({element}))
     must carry NO transform / transition / animation, because MapLibre writes
     a position transform onto it every frame and any of ours would fight it
     (= pins drift on pan). All visuals + hover go on the inner child. */
  .marker { width: 0; height: 0; }
  .marker-inner {
    position: relative;
    width: 22px; height: 22px;
    margin-left: -11px; margin-top: -11px;
    border-radius: 50%;
    background: var(--marker-color, var(--accent));
    border: 2px solid #0a0c10;
    box-shadow: 0 0 0 1px var(--marker-color, var(--accent)), 0 4px 12px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    pointer-events: auto;
  }
  .marker-inner:hover { transform: scale(1.25); }
  .marker-inner.active {
    transform: scale(1.4);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.3),
                0 0 0 1px var(--marker-color, var(--accent)),
                0 4px 14px rgba(0,0,0,0.7);
  }

  /* ---------- Popup ---------- */
  .maplibregl-popup-content {
    background: var(--panel) !important; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: inherit; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important;
    border-bottom-color: var(--panel) !important; }
  .popup-cat { color: var(--marker-color, var(--accent)); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; margin: 0 0 4px; font-weight: 600; }
  .popup-name { font-weight: 600; font-size: 13px; margin: 0 0 4px; }
  .popup-note { color: var(--muted); font-size: 12px; margin: 0 0 8px;
    line-height: 1.45; max-width: 240px; }
  .popup-link { color: var(--accent); font-size: 11px; text-decoration: none; font-weight: 600; }
  .popup-link:hover { text-decoration: underline; }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Footer ---------- */
  footer {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
    padding: 6px 12px; background: rgba(10,12,16,0.85);
    color: var(--muted); font-size: 10px; text-align: right;
    border-top: 1px solid var(--border); pointer-events: auto;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ---------- MapLibre control overrides ---------- */
  .maplibregl-ctrl-group {
    background: var(--panel) !important;
    border: 1px solid var(--border) !important;
  }
  .maplibregl-ctrl-group button { background-color: var(--panel) !important; }
  .maplibregl-ctrl-group button:hover { background-color: var(--panel-2) !important; }
  .maplibregl-ctrl-group button span { filter: invert(1) brightness(0.85); }
  .maplibregl-ctrl-attrib { background: rgba(10,12,16,0.7) !important; color: var(--muted) !important; }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
</style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>

  <div id="app">
    <aside id="sidebar">
      <div class="side-header">
        <h1>Barcelona <span class="count" id="count">0 items</span></h1>
        <div class="sub">A hand-picked map of independent spots — coffee, brunch &amp; restaurants.</div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </aside>

    <div id="map-wrap">
      <div class="controls">
        <button id="toggle3d" class="btn" type="button">3D</button>
      </div>
      <div id="map"></div>
      <footer>
        Tiles © <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ·
        Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
        Rendered with <a href="https://maplibre.org" target="_blank" rel="noopener">MapLibre GL</a>
      </footer>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
  (function () {
    'use strict';

    // ----- Config -----
    const CENTER = [2.1734, 41.3851]; // Barcelona
    // Generous bounding box covering metro Barcelona; any point outside is dropped
    const BBOX = { minLng: 2.00, maxLng: 2.35, minLat: 41.30, maxLat: 41.50 };

    // ----- Map -----
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: CENTER,
      zoom: 13,
      pitch: 0,
      bearing: 0,
      attributionControl: false
    });

    map.addControl(new maplibregl.AttributionControl({ compact: true }));
    map.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: true }), 'top-right');

    // ----- State -----
    let ALL_DATA = [];   // everything loaded from data.json
    let DATA = [];        // currently visible (post-filter) subset
    let markers = [];
    let activeIdx = -1;
    let currentPopup = null;
    let is3D = false;
    let activeGroup = 'All';
    const GROUP_ORDER = ['All', 'Coffee', 'Brunch', 'Sushi', 'Asian', 'Tapas', 'Vegan', 'Bakery', 'Pizza', 'Burger', 'Bar', 'Restaurant'];
    const GROUP_COLORS = {
      Coffee: 'var(--c-coffee)', Brunch: 'var(--c-brunch)', Sushi: 'var(--c-sushi)',
      Asian: 'var(--c-asian)', Tapas: 'var(--c-tapas)', Vegan: 'var(--c-vegan)',
      Bakery: 'var(--c-bakery)', Pizza: 'var(--c-pizza)', Burger: 'var(--c-burger)',
      Bar: 'var(--c-bar)', Restaurant: 'var(--c-restaurant)'
    };
    function groupColor(group) { return GROUP_COLORS[group] || 'var(--accent)'; }

    // ----- Sub-category detection (keyword match against name + note) -----
    // Runs only on places already bucketed as "Restaurant" — Coffee/Brunch are
    // already precise. First matching rule wins (exclusive, like the top-level groups).
    const CATEGORY_RULES = [
      { key: 'Sushi',  keywords: ['sushi', 'ramen', 'izakaya', 'yakitori', 'sashimi', 'nigiri', 'hotpot', 'tonkotsu', 'japon', 'japanese'] },
      { key: 'Asian',  keywords: ['thai', 'vietnam', 'pho', 'korean', 'corea', 'coreà', 'bbq', 'wok', 'dumpling', 'bao', 'chinese', 'sichuan', 'tofu', 'indian', 'india'] },
      { key: 'Tapas',  keywords: ['tapas', 'vins', 'wine', 'vermut', 'cava', 'bodega'] },
      { key: 'Vegan',  keywords: ['vegan', 'vegetarian', 'bowl', 'healthy', 'salad', 'poke'] },
      { key: 'Bakery', keywords: ['pastisseria', 'bakery', 'pastry', 'pie', 'cake', 'granja', 'gelato'] },
      { key: 'Pizza',  keywords: ['pizza', 'pasta', 'italian', 'trattoria'] },
      { key: 'Burger', keywords: ['burger'] },
      { key: 'Bar',    keywords: ['cocktail', 'bar de', 'beer', 'cerveza', 'brewery', 'vermouth'] },
    ];
    function detectSubCategory(p) {
      const haystack = ((p.name || '') + ' ' + (p.note || '')).toLowerCase();
      for (const rule of CATEGORY_RULES) {
        if (rule.keywords.some((kw) => haystack.includes(kw))) return rule.key;
      }
      return null;
    }

    // ----- Theme: recolor every layer to dark monochrome + hide POI labels -----
    function applyTheme() {
      const layers = (map.getStyle().layers || []);
      const C = {
        bg:        '#0a0c10',
        land:      '#11141a',
        landAlt:   '#0d1015',
        water:     '#06080d',
        building:  '#161a22',
        road:      '#1d2330',
        roadMajor: '#2a3140',
        rail:      '#171c26',
        text:      '#7a8395',
        textHalo:  '#0a0c10'
      };

      for (const layer of layers) {
        const id = layer.id;
        const type = layer.type;

        try {
          if (type === 'background') {
            map.setPaintProperty(id, 'background-color', C.bg);
            continue;
          }

          if (type === 'fill') {
            if (/water|sea|ocean|lake|river/i.test(id))      map.setPaintProperty(id, 'fill-color', C.water);
            else if (/building/i.test(id))                   map.setPaintProperty(id, 'fill-color', C.building);
            else if (/park|wood|forest|grass|cemetery|pitch|sand|landuse/i.test(id))
                                                             map.setPaintProperty(id, 'fill-color', C.landAlt);
            else                                             map.setPaintProperty(id, 'fill-color', C.land);
            continue;
          }

          if (type === 'line') {
            if (/water|river|stream|canal/i.test(id))        map.setPaintProperty(id, 'line-color', C.water);
            else if (/motorway|trunk|primary/i.test(id))     map.setPaintProperty(id, 'line-color', C.roadMajor);
            else if (/rail|transit|aerialway/i.test(id))     map.setPaintProperty(id, 'line-color', C.rail);
            else                                             map.setPaintProperty(id, 'line-color', C.road);
            continue;
          }

          if (type === 'symbol') {
            // Hide all POI labels (only our pins should show)
            if (/poi|place_of_worship|landuse|natural|park|aeroway|housenumber/i.test(id)) {
              map.setLayoutProperty(id, 'visibility', 'none');
              continue;
            }
            // Keep ONLY major road labels — hide all other road/street labels
            if (/road|street|highway|transport/i.test(id) && !/motorway|trunk|primary/i.test(id)) {
              map.setLayoutProperty(id, 'visibility', 'none');
              continue;
            }
            // Style the labels we keep (place names, motorway labels, etc.)
            try { map.setPaintProperty(id, 'text-color', C.text); } catch (_) {}
            try { map.setPaintProperty(id, 'text-halo-color', C.textHalo); } catch (_) {}
            try { map.setPaintProperty(id, 'text-halo-width', 1.4); } catch (_) {}
          }
        } catch (_) {
          /* some layers may not accept the property — just skip */
        }
      }
    }

    // ----- 3D buildings layer -----
    function ensure3DLayer() {
      if (map.getLayer('3d-buildings')) return;
      // Insert beneath the first symbol layer so labels stay readable
      let beforeId;
      for (const l of map.getStyle().layers) {
        if (l.type === 'symbol') { beforeId = l.id; break; }
      }
      try {
        map.addLayer({
          id: '3d-buildings',
          source: 'openmaptiles',
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 13,
          paint: {
            'fill-extrusion-color': '#232a36',
            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
            'fill-extrusion-base':   ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
            'fill-extrusion-opacity': 0.9
          }
        }, beforeId);
      } catch (e) {
        console.warn('Could not add 3D buildings layer:', e);
      }
    }

    function toggle3D() {
      is3D = !is3D;
      const btn = document.getElementById('toggle3d');
      btn.classList.toggle('active', is3D);

      if (is3D) {
        ensure3DLayer();
        if (map.getLayer('3d-buildings')) {
          map.setLayoutProperty('3d-buildings', 'visibility', 'visible');
        }
        map.easeTo({ pitch: 55, bearing: -17, duration: 900 });
      } else {
        if (map.getLayer('3d-buildings')) {
          map.setLayoutProperty('3d-buildings', 'visibility', 'none');
        }
        map.easeTo({ pitch: 0, bearing: 0, duration: 900 });
      }
    }

    document.getElementById('toggle3d').addEventListener('click', toggle3D);

    // ----- Coordinate guard -----
    function inBox(p) {
      return typeof p.lat === 'number' && typeof p.lng === 'number'
        && p.lat >= BBOX.minLat && p.lat <= BBOX.maxLat
        && p.lng >= BBOX.minLng && p.lng <= BBOX.maxLng;
    }

    // ----- Stacked-pin fan-out -----
    // Points at (within ~1m of) the same coordinate get a fixed pixel offset
    // placed in a small ring. The offset is passed to maplibregl.Marker({offset}),
    // so MapLibre keeps full control of the marker root transform.
    function computeFanOffsets(points) {
      const groups = new Map();
      points.forEach((p, i) => {
        const key = p.lat.toFixed(5) + ',' + p.lng.toFixed(5);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(i);
      });
      const offsets = points.map(() => [0, 0]);
      const R = 16; // px radius of the fan ring
      for (const idxs of groups.values()) {
        if (idxs.length <= 1) continue;
        const n = idxs.length;
        idxs.forEach((idx, j) => {
          const a = (j / n) * Math.PI * 2 - Math.PI / 2; // start at top
          offsets[idx] = [Math.cos(a) * R, Math.sin(a) * R];
        });
      }
      return offsets;
    }

    // ----- Sidebar -----
    function renderSidebar() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      DATA.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.idx = String(i);
        row.innerHTML =
          '<div class="cat" style="--marker-color:' + groupColor(p.group) + '">' + escapeHtml(p.category) + '</div>' +
          '<div class="name">' + escapeHtml(p.name) + '</div>' +
          '<div class="note">' + escapeHtml(p.note) + '</div>' +
          (p.url ? '<a href="' + escapeAttr(p.url) + '" target="_blank" rel="noopener">Visit →</a>' : '');
        row.addEventListener('click', (e) => {
          if (e.target && e.target.tagName === 'A') return;
          focusPoint(i);
        });
        list.appendChild(row);
      });
      document.getElementById('count').textContent = DATA.length + ' items';
    }

    function setActive(i) {
      activeIdx = i;
      document.querySelectorAll('.row').forEach((r, idx) => {
        r.classList.toggle('active', idx === i);
      });
      markers.forEach((m, idx) => {
        const inner = m.getElement().querySelector('.marker-inner');
        if (inner) inner.classList.toggle('active', idx === i);
      });
      if (i >= 0) {
        const row = document.querySelector('.row[data-idx="' + i + '"]');
        if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function openPopup(i) {
      const p = DATA[i];
      if (currentPopup) currentPopup.remove();
      const html =
        '<div class="popup-cat" style="--marker-color:' + groupColor(p.group) + '">' + escapeHtml(p.category) + '</div>' +
        '<div class="popup-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="popup-note">' + escapeHtml(p.note) + '</div>' +
        (p.url ? '<a class="popup-link" href="' + escapeAttr(p.url) + '" target="_blank" rel="noopener">Visit →</a>' : '');
      currentPopup = new maplibregl.Popup({ offset: 20, closeButton: false, maxWidth: '260px' })
        .setLngLat([p.lng, p.lat])
        .setHTML(html)
        .addTo(map);
      currentPopup.on('close', () => { currentPopup = null; });
    }

    function focusPoint(i) {
      setActive(i);
      const p = DATA[i];
      map.easeTo({
        center: [p.lng, p.lat],
        zoom: Math.max(map.getZoom(), 15.5),
        duration: 900
      });
      openPopup(i);
    }

    // ----- Filters -----
    function renderFilters() {
      const wrap = document.getElementById('filters');
      wrap.innerHTML = '';
      GROUP_ORDER.forEach((group) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn' + (group === activeGroup ? ' active' : '');
        const n = group === 'All' ? ALL_DATA.length : ALL_DATA.filter((p) => p.group === group).length;
        const color = groupColor(group);
        const active = group === activeGroup;
        btn.style.color = active ? '#0a0c10' : color;
        btn.style.borderColor = color;
        btn.style.background = active ? color : 'var(--panel-2)';
        if (group !== 'All') {
          const dot = document.createElement('span');
          dot.className = 'filter-dot';
          dot.style.background = active ? '#0a0c10' : color;
          btn.appendChild(dot);
        }
        btn.appendChild(document.createTextNode(group + ' (' + n + ')'));
        btn.addEventListener('click', () => setFilter(group));
        wrap.appendChild(btn);
      });
    }

    function setFilter(group) {
      activeGroup = group;
      DATA = group === 'All' ? ALL_DATA.slice() : ALL_DATA.filter((p) => p.group === group);
      activeIdx = -1;
      if (currentPopup) { currentPopup.remove(); currentPopup = null; }
      renderFilters();
      renderSidebar();
      clearMarkers();
      addMarkers();
    }

    // ----- Markers -----
    function clearMarkers() {
      markers.forEach((m) => m.remove());
      markers = [];
    }

    function addMarkers() {
      const offsets = computeFanOffsets(DATA);
      DATA.forEach((p, i) => {
        // Root element MUST stay clean — no transform/transition/animation
        const el = document.createElement('div');
        el.className = 'marker';

        // Inner child owns ALL visuals + hover/animation
        const inner = document.createElement('div');
        inner.className = 'marker-inner';
        inner.style.setProperty('--marker-color', groupColor(p.group));
        inner.setAttribute('aria-label', p.name);
        inner.title = p.name;
        el.appendChild(inner);

        inner.addEventListener('click', (ev) => {
          ev.stopPropagation();
          focusPoint(i);
        });

        const marker = new maplibregl.Marker({
          element: el,
          offset: offsets[i] // fan-out as fixed pixel offset (MapLibre handles transforms)
        })
          .setLngLat([p.lng, p.lat])
          .addTo(map);

        markers.push(marker);
      });
    }

    // ----- Utils -----
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // ----- Boot -----
    async function boot() {
      try {
        const res = await fetch('data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const raw = await res.json();

        const filtered = [];
        for (const p of raw) {
          if (!inBox(p)) {
            console.warn('[coord-guard] Skipping "' + (p.name || '?') + '" — outside region (' + p.lat + ', ' + p.lng + ')');
            continue;
          }
          if (!p.group) p.group = p.category || 'Restaurant';
          if (p.group === 'Restaurant') {
            const sub = detectSubCategory(p);
            if (sub) p.group = sub;
          }
          filtered.push(p);
        }
        ALL_DATA = filtered;

        setFilter('All');

        document.getElementById('loader').classList.add('hidden');
      } catch (e) {
        console.error('Failed to load data.json:', e);
        document.getElementById('loader').innerHTML =
          '<div style="color:var(--accent);font-family:inherit;font-size:13px">' +
          'Failed to load data.json — are you serving over http://?</div>';
      }
    }

    map.on('load', () => {
      applyTheme();
      boot();
    });

    // Close popup + clear active when clicking empty map
    map.on('click', (e) => {
      // Marker click handlers stop propagation, so a real map click means empty space
      if (currentPopup) currentPopup.remove();
      setActive(-1);
    });
  })();
  </script>
</body>
</html>
